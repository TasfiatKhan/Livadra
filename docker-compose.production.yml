# Production overrides — use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build
#
# Requires Docker Compose >= 2.24 for `!reset` (plain `ports: []` is MERGED with the
# base file's ports, not replacing them, so it would leave dev ports published).
#
# Variables below are read from the shell or a root-level `.env` next to this file
# (gitignored). Compose refuses to start if any required one is missing. The backend
# also reads ./backend/.env for SECRET_KEY, ALLOWED_HOSTS, CORS_ALLOWED_ORIGINS,
# ANTHROPIC_API_KEY, OPENAI_API_KEY, etc.
#
# Only the proxy (Caddy) publishes ports. Postgres, Redis, and gunicorn are reachable
# solely on the internal Compose network.

services:
  db:
    ports: !reset []
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    # Persistent storage: the named `postgres_data` volume from the base file is kept.

  redis:
    ports: !reset []
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}

  backend:
    # Run the code baked into the image — no source bind mount in production.
    volumes: !reset []
    ports: !reset []
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      # Same values Postgres is initialised with, so the two can't drift apart.
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Used by deployment/Caddyfile as the site address (and for the TLS certificate).
      DOMAIN: ${DOMAIN:?DOMAIN must be set, e.g. api.livadra.com}
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
